services:
  - type: web
    name: motoai-frontend
    env: static
    plan: free
    autoDeploy: false
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        value: https://motoraiagent.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
